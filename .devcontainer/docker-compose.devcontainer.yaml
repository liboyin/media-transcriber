# The dev container's Compose project, the only Compose file so far: the production CUDA
# service is a later task, because the CUDA machine is not available yet (DESIGN decision M15).
# It builds the Dockerfile's dev target, which installs the locked dev group through PYPI_PROXY
# at build time.
#
# No host data is mounted: no staging share, no model weights directory and no video library
# (DESIGN section 9). Work that needs them is a host check, run outside this container with the
# user's authorization for each run. Keep it that way; there is no real-data configuration.
name: media-transcriber

services:
  app:
    build:
      context: ..
      target: dev
      additional_contexts:
        # Shared apt/uv install scripts, pinned to a version tag. Set BUILD_COMMON_CONTEXT in
        # .env to a local clone to build offline, or to test a change to the helpers before it
        # is tagged.
        build_common: "${BUILD_COMMON_CONTEXT:-https://github.com/liboyin/docker-build-common.git#v1.2.0}"
      args:
        # Optional caching proxies. Default to empty (direct internet); set in .env to use a proxy.
        APT_PROXY: ${APT_PROXY:-}
        PYPI_PROXY: ${PYPI_PROXY:-}
    init: true
    # The dev container runs its own command (devcontainer.json's overrideCommand), publishes no
    # port and is not restarted by Docker.
    restart: "no"
    # Claude Code and Codex state lives on the dev_persist volume, which survives sessions and
    # rebuilds on this machine; only `docker compose down -v` deletes it. The creation hook creates
    # these directories. CLAUDE_CONFIG_DIR also moves ~/.claude.json, so Claude Code's settings,
    # history, memory and sign-in persist; CODEX_HOME does the same for Codex. Nothing here is
    # shared with other machines; only the Git repository is.
    environment:
      CLAUDE_CONFIG_DIR: /home/ubuntu/persist/claude
      CODEX_HOME: /home/ubuntu/persist/codex
    volumes:
      - dev_db:/var/lib/media-transcriber
      - dev_persist:/home/ubuntu/persist

volumes:
  dev_db:
  dev_persist:
