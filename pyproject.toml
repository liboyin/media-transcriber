[build-system]
requires = ["setuptools >= 64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "media-transcriber"
version = "0.0.1"
description = "Transcribe staged media into SRT subtitles and benchmark Whisper engines"
requires-python = ">=3.14"
authors = [
  {name = "Libo Yin", email = "liboyin830@gmail.com"}
]
dependencies = [
  "faster-whisper>=1.2.1",
  "huggingface-hub>=2.4.0",
  "numpy>=2.5.5",
  "pathlib-extensions",
]

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "pytest-cov",
  "pytest-mock",
  "pytest-randomly",
  "ruff",
]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
# Narrow stubs for engine libraries that ship no type information. They declare only the names
# that the adapters use (the shared constraints of T4, the faster-whisper adapter).
mypy_path = "stubs"
# Missing imports are errors, so a misspelt module or a missing stub fails the gate. Packages that
# ship no type information get a narrow override when the application first imports them; adding
# one earlier makes warn_unused_configs report an unused section on every run.

[[tool.mypy.overrides]]
# pathlib-extensions ships no py.typed marker, so its annotations are invisible to mypy. Only the
# staging layer imports it, and its tests exercise StagedFile and OverwritePolicy directly.
module = "pathlib_extensions"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=media_transcriber --cov=.agents/skills/adversarial-review/references --cov-report=term-missing --cov-fail-under=80"
# AGENTS.md requires new warnings to be resolved, so any warning fails its test; a test that
# expects one asserts it with pytest.warns, and an accepted tooling warning needs a narrow,
# commented filter here.
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
branch = true

[tool.setuptools.packages.find]
include = ["media_transcriber*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pycodestyle, Pyflakes, import order, bugbear, pyupgrade and pydocstyle. The target Python
# comes from requires-python.
select = ["E", "W", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
# AGENTS.md requires Google-style docstrings.
convention = "google"

[tool.uv.sources]
pathlib-extensions = { git = "https://github.com/liboyin/pathlib-extensions.git" }
